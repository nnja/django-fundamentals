services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rescuescout
      POSTGRES_USER: rescuescout
      POSTGRES_PASSWORD: rescuescout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rescuescout -d rescuescout"]
      interval: 2s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
